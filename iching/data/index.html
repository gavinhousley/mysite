<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The I-Ching or Book of Changes</title>
  </head>

  <body>
    <h1>I-CHING</h1>
    <p>The Book of Changes as Program</p>
    <button id="throw-button">THROW</button>
    <button id="stop-button">STOP</button>

    <div class="line" id="line-1"></div>
    <div class="line" id="line-2"></div>
    <div class="line" id="line-3"></div>
    <div class="line" id="line-4"></div>
    <div class="line" id="line-5"></div>
    <div class="line" id="line-6"></div>

    <div id="reading">
      <h3 id="reading-title"></h3>

      <p>Your reading will appear here</p>
      <div id="judgement"><p>Your judgement will appear here</p></div>
      <div id="image"><p>Your image will appear here</p></div>
      <div id="lines"><p>Your lines will appear here</p></div>
    </div>

    <div id="second-reading">
      <p>Your 2nd reading will appear here</p>
    </div>
  </body>
</html>
